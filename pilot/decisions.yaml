- id: D28
  title: Precision simulation
  value:
    n_sim: 200
    dry_variance_factors:
    - 1.5
    - 2.0
    seed: 20261114
  reason: 200 simulations per scenario give the half-width of the 95% interval to about 5%. The higher-variance
