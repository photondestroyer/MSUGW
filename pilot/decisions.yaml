- id: D23
  title: Water-table interpolation
  value:
    method: regression kriging
    drift: land-surface elevation
    variogram: exponential
    neighbours: 32
    max_km: 40
    per: year
    se_coverage: 0.95
  reason: Water-table elevation follows land surface closely in the High Plains; regression on land-surface elevation
    removes that trend and the residual is kriged (exponential variogram fitted each year on lags up to 60 km),
    32 wells within 40 km. The kriging SE is calibrated each year on wells held out by location so that 95% of them
    lie within +-1.96 SE (the raw SE covered 75-82%). The fitted range sits on its 500 km bound; lifting the bound
    changes held-out errors by under 0.2 m, so it is kept.
  tasks:
  - '2.4'
  status: fixed
   
  proposed_on: '2026-11-14'
  fixed_by: ishan sinha
  fixed_on: '2026-11-17'
  history:
  - value:
      method: regression kriging
      drift: land-surface elevation
      variogram: exponential
      neighbours: 32
      max_km: 40
      per: year
    fixed_by: ishan sinha
    fixed_on: '2026-11-17'
    replaced_on: '2026-11-17'
    replaced_by: ishan sinha
    reason_for_change: 'Kriging SE calibrated each year on location-held-out wells so that 95% of them lie within
      +-1.96 SE. The raw kriging SE (median 2.6-3.9 m) covered only 75-82% of held-out errors (RMSE 7-8 m): the
      variogram is fitted on lags of 2-60 km and has no information on very short-range variation. Found in the
      Stage 3 thickness check (no ET seen). The variogram range sits on its 500 km fitting bound every year; refitting
      without the bound changed held-out RMSE and SE by under 0.2 m (2011, 2020), so the bound is kept.'
- id: D24
  title: Aquifer base and its uncertainty
  value:
    base: KGS section hpa_bedrock
    se: 1.4826 x MAD of (USGS bottom - KGS base) by GMD, times sqrt(kgs_variance_share)
    kgs_variance_share: 0.5
  reason: The KGS base is built from 37,026 Kansas bedrock picks and is the most local surface. Its error comes
    from the robust spread (1.4826 x MAD, the SD of normally distributed data) of its difference with the independent
    USGS 1998 surface, by GMD. That spread holds both surfaces' errors, so half of its variance is assigned to KGS
    (SE / sqrt 2).
  tasks:
  - '2.4'
  status: fixed
   
  proposed_on: '2026-11-14'
  fixed_by: ishan sinha
  fixed_on: '2026-11-17'
  history:
  - value:
      base: KGS section hpa_bedrock
      se: 1.4826 x MAD of (USGS bottom - KGS base) by GMD
    fixed_by: ishan sinha
    fixed_on: '2026-11-17'
    replaced_on: '2026-11-17'
    replaced_by: ishan sinha
    reason_for_change: The USGS-KGS difference holds the errors of both surfaces (Var = Var_KGS + Var_USGS); charging
      all of it to KGS overstated the base error. With no independent measure of either, the variance is split equally
      (KGS SE = robust SD / sqrt 2). Thickness only; no ET seen.
- id: D25
  title: Poor thickness estimate
  value:
    max_se_m: 15
    third_z: 1.96
    max_well_km: 8
  reason: 'A cell-year is excluded ("poor thickness") when (1) the SE of A exceeds 15 m (a 95% interval wider than
    +-29 m, wider than the whole thin third); or (2) it is in the thin third and A + 1.96 SE reaches the thick cut,
    or in the thick third and A - 1.96 SE reaches the thin cut (it could belong to the opposite extreme); or (3)
    the nearest measured well of that pre-season is farther than 8 km; or A is not positive. Middle-third cells
    are not tested by (2): the models use A as continuous.'
  tasks:
  - '2.4'
  - '1.7'
  status: fixed
   
  proposed_on: '2026-11-14'
  fixed_by: ishan sinha
  fixed_on: '2026-11-17'
  history:
  - value:
      max_rel_se: 0.5
      max_well_km: 8
    fixed_by: ishan sinha
    fixed_on: '2026-11-17'
    replaced_on: '2026-11-17'
    replaced_by: ishan sinha
    reason_for_change: 'The relative rule (SE > 0.5 A) excluded every cell-year under 15 m and 49% of the thin third,
      because the base error is roughly constant in metres; it selected on A itself. Replaced by two rules: an absolute
      test (SE above 15 m: a 95% interval wider than +-29 m, wider than the whole thin third) and a third-confidence
      test (a thin cell-year whose 95% interval reaches the thick cut, or a thick one reaching the thin cut). Middle
      cells are not third-tested: testing them would drop about 91% of them, and the models use A as continuous.
      Well-distance (8 km) and A <= 0 rules unchanged. Thickness only; no ET seen.'
