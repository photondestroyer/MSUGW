- id: D30
  title: Model formulas (main analysis)
  value:
    unit: cohort cell-year, peak month of its county-year (Task 1.1)
    outcome: peak-month ET in mm, et_ensemble_mad (D29); each OpenET model refitted as sensitivity
    fixed_effects:
    - cell
    - county x year
    every_model:
    - A
    - A x seasonal deficit
    - root-zone storage x each drought term
    - corn years 2013-2015 (2 or 3) x each drought term
    C1: 'every_model + A x S (peak month); sample: soil-moisture mask (Task 1.7)'
    P1: 'every_model + A x peak-month deficit; sample: peak-demand mask'
    J1: 'every_model + A x S + A x peak-month deficit; sample: common mask'
    T1: 'monthly ET May-Sep; cell x month and county x month x year effects; A x monthly exposure, A x peak-month
      indicator (required), A x monthly exposure x peak-month indicator; sample: timing mask'
    T1_monthly_exposure: monthly deficit (reference ET - precipitation)
    A: continuous, cell-year value of Check 2.4; cell-years flagged poor (D25) left out
    A_error: attenuation correction of all A terms with the D23 (per cell-year) and D24 (per cell) errors, as in
      Check 2.6; the uncorrected estimate reported beside it
    estimator: OLS with the fixed effects absorbed (within transformation)
  reason: 'Pilot Section 8, term by term: every model holds peak-month ET, cell and county-by-year effects, A as
    a continuous variable, A x seasonal deficit and root-zone storage and crop-history interactions (crop history
    = corn years in 2013-2015, 2 or 3: every cohort cell is crop class corn, so the class itself would be constant)
    with the drought terms; C1 adds A x S, P1 adds A x peak-month deficit, J1 both; T1 as written there. Choices
    added where Section 8 leaves them open: the outcome series (D29), T1''s ''monthly exposure'' read as the monthly
    deficit, the attenuation correction used in Check 2.6, and leaving poor-thickness cell-years out.'
  tasks:
  - main
  status: fixed
   
  proposed_on: '2026-11-17'
  fixed_by: ishan sinha
  fixed_on: '2026-11-17'
  history: &id002 []
- id: D31
  title: Contrasts and how they are read
  value:
    soil_moisture_contrast: (thin - thick) peak-month ET at S = 10th percentile minus the same at median S, from
      C1
    peak_demand_contrast: (thin - thick) at peak-month deficit = 90th percentile minus the same at its median, from
      P1
    percentiles_over: the model's own sample
    thin_thick_A: mean cell A of the thin and thick thirds (D26) in that sample
    support: evaluation points inside the range observed in both thirds (Check 2.9); both contrasts also on the
      common sample (J1); peak-demand also on its full sample
    interval: 95%, SE clustered by county (10 km blocks if fewer than 10 counties); t with G-1 df below 50 clusters
    expected_sign: negative (thin cells lose more peak-month ET as conditions dry)
    evidence: a contrast whose 95% interval excludes zero; both contrasts reported whatever their result
    per_model: each of the six OpenET models reported; their range is not a confidence interval
    sensitivity:
    - base error per district (Check 2.6 scenario)
    - uncorrected for thickness error
    - J1 against C1 and P1
  reason: 'Pilot Section 8 defines the two contrasts (10th percentile of S and 90th of the peak-month deficit, each
    against the median), the support rule and the common-sample comparison; Figure 3 asks for 95% intervals for
    each ET model. Added: clustering as in Checks 2.5-2.6, the expected sign written down before the result, and
