  history: []
- id: D21
  title: ET model coverage of a cell-month
  value:
    min_valid_share: 0.8
    min_models: 4
  reason: A model counts for a cell-month when at least 80% of the cell's pixels hold a value with a positive observation
    count (count 0 means OpenET filled the month from other dates). A cell-month is supported with at least 4 of
    the 6 models (pilot target).
  tasks:
  - '1.4'
  - et_cells
  - '2.3'
  status: fixed
  proposed_by: Claude
  proposed_on: '2026-11-14'
  fixed_by: ishan sinha
  fixed_on: '2026-11-17'
  history: []
- id: D22
  title: Wells and water levels
  value:
    kgs: winter table
    usgs_months:
    - 1
    - 2
    - 3
    - 4
    usgs_status:
    - Static
    keep_code_prefixes:
    - '11'
    - '12'
    blank_code: keep inside KGS HPA extent
    land_surface: GLO30 DEM at the well
  reason: KGS winter levels are measured when pumps are idle (recovered). USGS records add only January-April "Static"
    levels. Aquifer codes 11x/12x (Quaternary, Pleistocene, Ogallala) are the High Plains aquifer; other codes (Dakota,
    Permian, bedrock) are excluded; a blank code is kept inside the KGS HPA extent. Land-surface elevation for every
    well comes from one source (GLO30 DEM) because reported altitudes mix NGVD29 and NAVD88.
  tasks:
  - '1.5'
  - '2.4'
  status: fixed
  proposed_by: Claude
  proposed_on: '2026-11-14'
  fixed_by: ishan sinha
  fixed_on: '2026-11-17'
  history: []
- id: D23
  title: Water-table interpolation
  value:
    method: regression kriging
    drift: land-surface elevation
    variogram: exponential
    neighbours: 32
    max_km: 40
    per: year
  reason: Water-table elevation follows land surface closely in the High Plains; regression on land-surface elevation
    removes that trend and the residual is kriged (exponential variogram fitted each year), giving a kriging variance
    for every cell. Local neighbourhoods of 32 wells within 40 km keep it fast and local.
  tasks:
  - '2.4'
  status: fixed
  proposed_by: Claude
  proposed_on: '2026-11-14'
  fixed_by: ishan sinha
  fixed_on: '2026-11-17'
  history: []
- id: D24
  title: Aquifer base and its uncertainty
  value:
    base: KGS section hpa_bedrock
    se: 1.4826 x MAD of (USGS bottom - KGS base) by GMD
  reason: The KGS base is built from 37,026 Kansas bedrock picks and is the most local surface. Its error is taken
    from the spread against the independent USGS 1998 surface (typical difference about 24 ft), by GMD.
  tasks:
  - '2.4'
  status: fixed
  proposed_by: Claude
  proposed_on: '2026-11-14'
  fixed_by: ishan sinha
  fixed_on: '2026-11-17'
  history: []
- id: D25
  title: Poor thickness estimate
  value:
    max_rel_se: 0.5
    max_well_km: 8
  reason: A cell-year is excluded ("poor thickness") when the standard error of A exceeds half of A or the nearest
    measured well of that pre-season is farther than 8 km (the pilot's support distance).
  tasks:
  - '2.4'
  - '1.7'
  status: fixed
  proposed_by: Claude
  proposed_on: '2026-11-14'
  fixed_by: ishan sinha
  fixed_on: '2026-11-17'
  history: []
- id: D26
  title: Thickness thirds
  value:
    true: cohort cell mean A over 2016-2024
    quantiles:
    - 0.3333333
    - 0.6666667
  reason: Thirds are cut once, on each cohort cell's mean thickness over the panel, so a cell keeps its third in
    every year and the cut does not move with drought years. For display only; models use A as continuous.
  tasks:
  - '2.4'
  - '2.9'
  status: fixed
  proposed_by: Claude
  proposed_on: '2026-11-14'
  fixed_by: ishan sinha
