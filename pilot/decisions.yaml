- id: D20
  title: Dry conditions (blinding)
  value:
    season_pct: 70
    s_pct: 30
    missing_s_is_dry: true
    months:
    - 5
    - 6
    - 7
    - 8
    - 9
  reason: The pilot's own definition. Percentiles over all Kansas county-years (seasons) and county-months (S) of
    2016-2024. A month is dry when its season is dry or its S is below the 30th percentile or missing.
  tasks:
  - dry
  - et_cells
  - '2.1'
  - '2.6'
