  history: []
- id: D27
  title: Processing-test counties (Stage 2)
  value:
    n_counties: 4
    cells_per_county: 75
    cohort_per_county: 50
    rainfed_per_county: 25
    seed: 20261114
    min_cohort_cells: 300
  reason: 'Four counties from thin to thick aquifer: counties with at least 300 cohort cells are split into thickness
    quartiles (KGS 2019-2021 section thickness), and from each quartile the county most different in normal rainfall
    and soil from those already chosen is taken. 75 cells per county (50 cohort, 25 rainfed) drawn with the recorded
    seed.'
